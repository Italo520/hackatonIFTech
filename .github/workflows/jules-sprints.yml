name: Jules - executar próxima sprint

on:
  workflow_dispatch:
  schedule:
    # Verifica periodicamente se a sprint anterior foi integrada.
    - cron: "*/15 * * * *"

concurrency:
  group: jules-sprints
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    name: Disparar Jules com segurança
    runs-on: ubuntu-latest
    steps:
      - name: Verificar PR de sprint já aberta
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          open_sprint_prs="$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --json title,headRefName \
            --jq '[.[] | select((.title | test("Sprint|T-[0-9]+"; "i")) or (.headRefName | test("jules"; "i")))] | length')"

          if [[ "$open_sprint_prs" -gt 0 ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Já existe PR de sprint aberta; nenhuma nova sessão será disparada."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma PR de sprint aberta; Jules pode executar a próxima tarefa."
          fi

      - name: Executar próxima sprint com Jules
        if: steps.guard.outputs.blocked == 'false'
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: main
          include_last_commit: true
          include_commit_log: true
          prompt: |
            Leia AGENTS.md e PLAN.md antes de começar.

            Execute somente a primeira sprint ou tarefa ainda não concluída no checklist de PLAN.md.
            Não execute sprints futuras e não crie uma segunda execução se houver trabalho em andamento.

            Siga integralmente as instruções de AGENTS.md:
            - apresente um plano curto antes de modificar arquivos;
            - implemente apenas um incremento coerente;
            - adicione ou atualize testes;
            - execute as validações aplicáveis;
            - atualize PLAN.md somente quando a tarefa estiver comprovadamente concluída;
            - abra um pull request com o escopo da sprint/tarefa;
            - pare e documente o bloqueio se houver falha, ambiguidade, dependência ausente,
              alteração destrutiva ou validação não executável.

            Nunca inclua segredos, nunca faça merge do próprio PR e nunca marque trabalho
            como concluído sem evidência nos testes ou na validação correspondente.
