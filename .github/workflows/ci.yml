name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm install
          npm run build

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute Migrations
        run: php artisan migrate --force

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: |
          php artisan test --without-tty 2>&1 | tee test_run.log || true

      - name: Commit and Push Test Log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test_run.log
          git commit -m "chore(ci): save test log report" || true
          git push origin main || true

      - name: Verify Test Success
        run: |
          if grep -q "FAILED" test_run.log || grep -q "FAILURES" test_run.log || grep -q "ERRORS" test_run.log || grep -q "FAIL" test_run.log; then
            cat test_run.log
            exit 1
          fi

      - name: Execute Composer Audit
        run: composer audit || true
